<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamify - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">
    <div class="admin-container">
        <header class="admin-header">
            <div class="logo">
                <i class="fa-solid fa-music"></i>
                <h2>Streamify Admin</h2>
            </div>
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Player</a>
        </header>

        <main class="admin-main">
            <section class="admin-form-section">
                <h3 id="formTitle">Add New Song</h3>
                <form id="songForm">
                    <input type="hidden" id="songId">
                    <div class="form-group">
                        <label for="title">Song Title *</label>
                        <input type="text" id="title" required placeholder="e.g. Bohemian Rhapsody">
                    </div>
                    <div class="form-group">
                        <label for="artist">Artist *</label>
                        <input type="text" id="artist" required placeholder="e.g. Queen">
                    </div>
                    <div class="form-group">
                        <label for="album">Album</label>
                        <input type="text" id="album" placeholder="e.g. A Night at the Opera">
                    </div>
                    <div class="form-group">
                        <label for="cover_url">Cover Image URL</label>
                        <input type="url" id="cover_url" placeholder="https://example.com/cover.jpg">
                    </div>
                    <div class="form-group">
                        <label for="audio_url">Cloudinary Audio URL *</label>
                        <input type="url" id="audio_url" required placeholder="https://res.cloudinary.com/.../audio.mp3">
                    </div>
                    <div class="form-actions">
                        <button type="button" id="cancelBtn" class="secondary-btn" style="display: none;">Cancel</button>
                        <button type="submit" id="submitBtn" class="primary-btn">Add Song</button>
                    </div>
                </form>
            </section>

            <section class="admin-list-section">
                <h3>Manage Songs</h3>
                <div class="loading" id="adminLoading">Loading...</div>
                <div class="admin-songs-list" id="adminSongsList">
                    <!-- Admin song items populated here -->
                </div>
            </section>
        </main>
    </div>
    <script src="supabase-client.js"></script>
    <script src="admin.js"></script>
</body>
</html>
